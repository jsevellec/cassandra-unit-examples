# A row dataset: data only. Column types come from the live schema, so nothing is a CQL literal.

widget:
  - id: 11111111-1111-1111-1111-111111111111
    label: "1"                      # quoted, or it becomes the int 1
    tags: [alpha, beta]
    created: "2026-09-19T10:00:00Z"
    payload: "0x0a0b0c"             # quoted, or YAML reads it as a number
    quantity: 42                    # an Integer widens to bigint
    props: {a: 1, b: 2}

  - id: 22222222-2222-2222-2222-222222222222
    label: "it's fine"
    created: 1758276000000          # epoch millis rather than a date

  # An explicit null writes a tombstone.
  - id: 33333333-3333-3333-3333-333333333333
    label: null

  # label absent, not null: the preexisting row keeps its label.
  - id: 00000000-0000-0000-0000-000000000009
    tags: [kept]
