# A row dataset: data, and nothing else. The schema is already in the database when this loads, so
# the loader reads each column's real type from there and the driver's codecs do the conversion -
# which is why nothing here has to be written as a CQL literal.

widget:
  # Every column set, one conversion each.
  - id: 11111111-1111-1111-1111-111111111111
    label: "1"                      # quoted, so it stays the text "1" and never becomes the int 1
    tags: [alpha, beta]
    created: "2026-09-19T10:00:00Z"
    payload: "0x0a0b0c"             # quote a blob: unquoted, YAML reads 0x0a0b0c as a number
    quantity: 42                    # an Integer for a bigint column, so it widens
    props: {a: 1, b: 2}

  # An apostrophe, which needs no escaping here - this is not CQL.
  - id: 22222222-2222-2222-2222-222222222222
    label: "it's fine"
    created: 1758276000000          # a timestamp as epoch millis rather than a date

  # An explicit null writes a tombstone, erasing whatever was there.
  - id: 33333333-3333-3333-3333-333333333333
    label: null

  # label is absent, not null: the row loaded by preexistingWidget.cql keeps its label.
  - id: 00000000-0000-0000-0000-000000000009
    tags: [kept]
