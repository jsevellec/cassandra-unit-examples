# Strict, which is the default: the widget table must hold exactly these three rows. A table this
# file does not name - event - is not asserted at all.
#
# Only the columns mentioned here are compared, plus the primary key, and nothing else is even
# selected. `created` is listed but the test ignores it: it is the timestamp the code under test
# wrote, and there is no value it could be expected to equal.

widget:
  - id: 11111111-1111-1111-1111-111111111111
    label: "shipped"
    quantity: 1
    created: "2026-09-19T10:00:00Z"

  - id: 22222222-2222-2222-2222-222222222222
    label: "ordered"
    quantity: 2

  - id: 33333333-3333-3333-3333-333333333333
    label: "ordered"
    quantity: 3
